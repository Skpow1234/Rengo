[workspace]
members = [
    "rengo-core",
    "rengo-config",
    "rengo-storage",
]

[package]
name = "rengo"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rengo Distributed Database System"
authors = ["Rengo Team"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Skpow1234/Rengo"
repository = "https://github.com/Skpow1234/Rengo"
readme = "README.MD"
keywords = ["database", "distributed", "rust", "postgresql", "raft"]
categories = ["database", "concurrency", "data-structures"]

[[bin]]
name = "rengo"
path = "bin/rengo.rs"

[[test]]
name = "sql_integration"
path = "tests/sql/sql_integration.rs"

[[test]]
name = "storage_integration"
path = "tests/storage/storage_integration.rs"

[[test]]
name = "config_integration"
path = "tests/config/config_integration.rs"

[[test]]
name = "node_integration"
path = "tests/node_integration.rs"

[[bench]]
name = "storage"
harness = false

[features]
default = ["sled"]
rocksdb = ["dep:rocksdb", "rengo-storage/rocksdb"]
sled = ["dep:sled", "rengo-storage/sled"]
grpc-enabled = []

[dependencies]
# Workspace crates
rengo-core = { version = "0.1.0", path = "rengo-core" }
rengo-config = { version = "0.1.0", path = "rengo-config" }
rengo-storage = { version = "0.1.0", path = "rengo-storage", default-features = false }

# External dependencies
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
clap.workspace = true
serde.workspace = true
async-trait.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# gRPC and networking
tonic = "0.12"
prost = "0.13"
tower = "0.5"

# Storage engine dependencies (optional)
rocksdb = { version = "0.22", optional = true }
sled = { version = "0.34", optional = true }

# RAFT dependencies
bincode = "1.3"
rand = "0.8"

# Security: force patched transitive versions (RUSTSEC-2026-0007 / 0204 / 0258)
bytes = "1.11.1"
h2 = "0.4.16"
crossbeam-epoch = "0.9.20"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "tracing"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "2.0"
rmp-serde = "1.3"

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.24"
opentelemetry = { version = "0.23", features = ["rt-tokio"] }
metrics = { version = "0.23", features = ["std"] }

# Configuration
config = "0.14"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# CLI and user interaction
clap = { version = "4.4", features = ["derive", "color", "suggestions"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
comfy-table = "7.1"

# Binary dependencies
clap-bin = { version = "4.4", features = ["derive"] }

# No build dependencies needed
[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Testing frameworks
tokio-test = "0.4"
test-log = "0.2"
proptest = "1.5"
mockall = "0.13"
fake = "2.9"
rstest = "0.23"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
iai = "0.1"

# Test utilities
tempfile = "3.8"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = false
