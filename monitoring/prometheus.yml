# Prometheus configuration for Rengo monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Rengo metrics
  - job_name: 'rengo'
    static_configs:
      - targets: ['rengo:9090']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # Rengo cluster nodes
  - job_name: 'rengo-cluster'
    static_configs:
      - targets: 
        - 'rengo:9090'
        - 'rengo-node2:9090'
        - 'rengo-node3:9090'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
