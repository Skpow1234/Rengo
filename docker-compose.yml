# Rengo - Complete Docker Compose Configuration
# Supports development, production, and performance testing

services:
  # Main Rengo database service
  rengo:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - rengo:latest
    image: rengo:alpine-secure
    ports:
      - "5432:5432"  # PostgreSQL protocol
      - "9090:9090"  # gRPC API
    volumes:
      - rengo-data:/data/rengo
      - ./rengo.toml:/etc/rengo/config.toml:ro
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - RENGO_NODE_ID=node-1
    networks:
      - rengo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/rengo", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    profiles: ["default", "production"]

  # Development mode with hot reload
  rengo-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    ports:
      - "5433:5432"
      - "9091:9090"
    volumes:
      - .:/usr/src/rengo
      - rengo-dev-data:/data/rengo
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=full
      - RENGO_NODE_ID=dev-node
    networks:
      - rengo-net
    command: ["cargo", "run", "--bin", "rengo", "--", "start"]
    profiles: ["dev"]

  # Performance testing with monitoring
  rengo-perf:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5434:5432"
      - "9092:9090"
    volumes:
      - rengo-perf-data:/data/rengo
    environment:
      - RUST_LOG=warn
      - RUST_BACKTRACE=1
      - RENGO_NODE_ID=perf-node
    networks:
      - rengo-net
    healthcheck:
      test: ["CMD", "/rengo", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    profiles: ["perf"]

  # Multi-node cluster setup
  rengo-node2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5435:5432"
      - "9093:9090"
    volumes:
      - rengo-node2-data:/data/rengo
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - RENGO_NODE_ID=node-2
      - RENGO_CLUSTER_SEEDS=rengo:9090
    networks:
      - rengo-net
    depends_on:
      - rengo
    healthcheck:
      test: ["CMD", "/rengo", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    profiles: ["cluster"]

  rengo-node3:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5436:5432"
      - "9094:9090"
    volumes:
      - rengo-node3-data:/data/rengo
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - RENGO_NODE_ID=node-3
      - RENGO_CLUSTER_SEEDS=rengo:9090,rengo-node2:9090
    networks:
      - rengo-net
    depends_on:
      - rengo
      - rengo-node2
    healthcheck:
      test: ["CMD", "/rengo", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    profiles: ["cluster"]

  # Monitoring and observability
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9095:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - rengo-net
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - rengo-net
    depends_on:
      - prometheus
    profiles: ["monitoring"]

networks:
  rengo-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  rengo-data:
  rengo-dev-data:
  rengo-perf-data:
  rengo-node2-data:
  rengo-node3-data:
  grafana-data: