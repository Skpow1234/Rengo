[package]
name = "rengo-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Configuration management for Rengo distributed database"
authors = ["Rengo Team"]
license = "MIT OR Apache-2.0"

[dependencies]
# Workspace dependencies
serde.workspace = true
tokio.workspace = true
config.workspace = true
toml.workspace = true

# Additional dependencies
tracing.workspace = true

# Local dependencies
rengo-core = { version = "0.1.0", path = "../rengo-core" }

[dev-dependencies]
tempfile = "3.0"