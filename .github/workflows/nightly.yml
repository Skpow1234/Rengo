name: Nightly Quality

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Machete / Outdated / Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        run: |
          cargo install cargo-machete cargo-outdated cargo-audit --locked || true
          sudo apt-get update && sudo apt-get install -y jq

      - name: Unused deps (machete)
        run: cargo machete

      - name: Outdated deps (report only)
        run: cargo outdated || true

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      - name: cargo audit
        run: cargo audit

  miri:
    name: Miri (core + storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang
      - name: miri test
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo miri setup
          cargo miri test --package rengo-core --lib
          cargo miri test --package rengo-storage --features sled --no-default-features --lib

  benches:
    name: Benchmarks (sled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Register & run benches
        # Only the criterion harness understands these flags (not lib unit-test benches).
        run: >
          cargo bench --bench storage --features sled --no-default-features
          -- --warm-up-time 1 --measurement-time 2
