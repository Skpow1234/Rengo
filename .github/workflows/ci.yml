name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Fast gate: every PR / push ──────────────────────────────────────────
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (fail on correctness)
        run: >
          cargo clippy --workspace --all-targets
          --features sled --no-default-features
          -- -D clippy::correctness
          -A missing_docs
          -A clippy::must_use_candidate
          -A clippy::module_name_repetitions
          -A clippy::new_without_default

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.features }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: sled
          - os: ubuntu-latest
            features: rocksdb
          - os: windows-latest
            features: sled
          - os: macos-latest
            features: sled
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.features }}

      - name: System deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config protobuf-compiler clang

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl pkg-config cmake protobuf

      - name: Build
        shell: bash
        run: cargo build --all-targets --features ${{ matrix.features }} --no-default-features

      - name: Test (workspace + integration)
        shell: bash
        run: |
          cargo test --workspace --features ${{ matrix.features }} --no-default-features
          cargo test --tests --features ${{ matrix.features }} --no-default-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
          save-if: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || cargo install cargo-audit

      - name: cargo audit (fail on vulns)
        run: cargo audit

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  docs:
    name: Docs
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -A missing_docs
        run: cargo doc --workspace --features sled --no-default-features --no-deps

  docker:
    name: Docker
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Verify context
        run: |
          test -f .dockerignore
          test -f Cargo.lock
          test -f Cargo.toml
          test -f Dockerfile
          echo "Build context OK ($(du -sh . | cut -f1))"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: rengo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run --rm rengo:ci --version
          docker run --rm -d --name rengo-ci -p 5432:5432 rengo:ci
          sleep 3
          if ! docker ps | grep -q rengo-ci; then
            echo "Container exited early:"
            docker logs rengo-ci || true
            exit 1
          fi
          docker logs rengo-ci
          docker stop rengo-ci

  # ── Required status aggregator ──────────────────────────────────────────
  ci-success:
    name: CI Success
    if: always()
    needs: [lint, test, security, docs, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "security=${{ needs.security.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "docker=${{ needs.docker.result }}"
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" \
             || "${{ needs.security.result }}" != "success" \
             || "${{ needs.docs.result }}" != "success" \
             || "${{ needs.docker.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed"
