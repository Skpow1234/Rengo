name: Dependency Updates

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler clang

      - name: cargo update
        run: cargo update

      - name: Detect lockfile changes
        id: lockfile
        run: |
          if git diff --quiet Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-audit
        if: steps.lockfile.outputs.changed == 'true'
        run: cargo install cargo-audit --locked || cargo install cargo-audit

      - name: Test + audit after update
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          cargo test --workspace --features sled --no-default-features
          cargo test --workspace --features rocksdb --no-default-features
          cargo audit

      - name: Create pull request
        if: steps.lockfile.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update Cargo.lock dependencies"
          title: "chore: automated dependency updates"
          body: |
            Weekly `cargo update` with sled + rocksdb tests and `cargo audit` green.
          branch: automated/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
