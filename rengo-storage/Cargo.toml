[package]
name = "rengo-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Storage engine abstraction for Rengo distributed database"
authors = ["Rengo Team"]
license = "MIT OR Apache-2.0"

[dependencies]
# Workspace dependencies
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

# Local dependencies
rengo-core = { version = "0.1.0", path = "../rengo-core" }
rengo-config = { version = "0.1.0", path = "../rengo-config" }

# Storage engines
rocksdb = { version = "0.22", optional = true }
sled = { version = "0.34", optional = true }

[features]
default = ["sled"]
rocksdb = ["dep:rocksdb"]
sled = ["dep:sled"]
